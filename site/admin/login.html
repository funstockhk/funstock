<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B2545">
<title>登录 · 趣倉有限公司 · 一体化公司管理后台</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="css/admin.css?v=ac02-admin">
</head>
<body class="login-body">
<div class="preview-banner">
  <span>趣倉有限公司 · 一体化公司管理后台 · <strong>登录</strong></span>
  <span>请使用分配的账号登录。授权失败即拒绝，不会放宽鉴权。</span>
</div>
<div class="login-wrap">
  <div class="login-geometry" aria-hidden="true"></div>
  <header class="login-top">
    <img src="../assets/logo-horizontal-white.svg" alt="趣倉有限公司">
    <a class="login-home" href="../index.html">返回公司主页</a>
  </header>
  <form class="login-card" id="login-form" autocomplete="username">
    <p class="login-kicker">FUNSTOCK LIMITED</p>
    <h1>一体化公司管理后台</h1>
    <p class="lead">趣倉有限公司管理后台登录。授权人与顾问共用同一入口。鉴权失败即拒绝；授权表缺失或为空时不会放行。</p>
    <div class="err" id="err" role="alert" aria-live="assertive"></div>
    <div class="field">
      <label for="jobId">工号</label>
      <input id="jobId" name="jobId" required autofocus>
    </div>
    <div class="field">
      <label for="password">口令</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="btn amber full" type="submit" id="go">登录</button>
    <p class="hint">请使用分配的账号登录。请勿在页面或聊天中保存口令。</p>
  </form>
  <footer class="login-foot">
    <p>趣倉有限公司</p>
    <p>FUNSTOCK LIMITED</p>
    <p><a href="mailto:Funstockhk@gmail.com">Funstockhk@gmail.com</a></p>
    <p>©2026 FUNSTOCK LIMITED. 保留所有權利。</p>
  </footer>
</div>
<script src="js/config.js?v=ac02-admin-20261125r2"></script>
<script src="js/api.js?v=ac02-admin"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const errBox = document.getElementById('err');
  if (params.get('err') === 'auth_store') {
    errBox.textContent = '授权用户表缺失或不可用，已拒绝访问。';
    errBox.classList.add('show');
  }
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    const btn = document.getElementById('go');
    if (btn.dataset.busy === '1') return;
    btn.dataset.busy = '1';
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    const prev = btn.textContent;
    btn.textContent = '正在登录…';
    const jobId = document.getElementById('jobId').value.trim();
    const password = document.getElementById('password').value;
    try {
      await FS.api('login', { jobId, password, __timeoutMs: 20000 });
      location.replace((FS.adminBase ? FS.adminBase() : '.') + '/');
    } catch (err) {
      errBox.textContent = err.message || '登录失败，已拒绝。';
      errBox.classList.add('show');
      btn.dataset.busy = '0';
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.textContent = prev;
    }
  });
})();
</script>
</body>
</html>
